<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Box Challenge!</title>
    <style>
        body { background: #0b1a30; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: 50px auto; background: #15294a; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; color: #b3c5d7; line-height: 1.5; }
        .box-img { width: 150px; margin: 20px auto; animation: bounce 2s infinite; }
        .btn { display: inline-block; background: #ffcc00; color: #0b1a30; font-weight: bold; font-size: 18px; padding: 15px 40px; border-radius: 30px; text-decoration: none; box-shadow: 0 5px 15px rgba(255,204,0,0.4); transition: 0.2s; }
        .btn:hover { transform: scale(1.05); background: #ffe066; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 YOU WIN 1 LUCKY BOX!</h1>
    <p>Tap the box below to claim your standard bonus and start the mini-game!</p>
    
    <!-- Картинка коробки, на которую хочется нажать -->
    <a href="ТВОЯ_ССЫЛКА_ИЗ_OFFERGATE">
        <img src="https://cdn-icons-png.flaticon.com/512/4143/4143248.png" class="box-img" alt="Lucky Box">
    </a>
    
    <br><br>
    <a href="ТВОЯ_ССЫЛКА_ИЗ_OFFERGATE" class="btn">OPEN BOX</a>
</div>

</body>
</html>
